# LynxDB Configuration
# Uncomment and modify values as needed. All values shown are defaults.

# Listen address for the HTTP API server.
# listen: localhost:3100

# Root data directory. Set to "" to keep data in a temporary directory removed at shutdown.
# data_dir: ~/.local/share/lynxdb

# Global data retention period. Events older than this are deleted.
# retention: 7d

# Log level: debug, info, warn, error.
# log_level: info

# Storage engine configuration.
# storage:
#   partition: 24h                   # Span of time whose events are kept apart
#   flush_interval: 0s               # Longest wait before ingested events are written (0 = store default)
#   time_fields: [_time, timestamp, "@timestamp", time, ts]  # Fields that set the event time, in order
#   sort_key: []                     # Fields that order the rows of parts written from then on (empty = time order)
#   part_dictionary: false           # Keep one dictionary per part for string columns that repeat across blocks, in new indexes

# Query execution configuration.
# query:
#   sync_timeout: 30s                # Max wait for synchronous query completion
#   job_ttl: 5m                      # Completed job retention time
#   max_concurrent: 32               # Max concurrent queries
#   default_result_limit: 1000       # Default result row limit
#   max_result_limit: 50000          # Maximum allowed result row limit
#   max_query_length: 1048576        # Max query text length, bytes (1 MiB)

# Ingestion configuration.
# ingest:
#   max_body_size: 100mb             # Max HTTP request body size
#   max_batch_size: 1000             # Max events per streaming batch
#   max_line_bytes: 1048576          # Max bytes per single line in streaming ingest (1 MiB)
#   es_compat:
#     enabled: true                  # Enable drop-in Elasticsearch shipper endpoints
#     advertised_version: 8.15.0     # Version shown to Filebeat/Fluent Bit/Vector
#     cluster_name: lynxdb           # Cluster name in Elasticsearch handshake
#   otlp:
#     http_listen: localhost:4318    # Canonical OTLP/HTTP listen address (empty = disabled)
#     grpc_listen:                   # OTLP/gRPC listen address (empty = disabled)
#     grpc_max_recv_bytes: 16mb      # OTLP/gRPC max receive message size
#   splunk_hec:
#     enabled: true                  # Enable Splunk HEC-compatible routes
#   limits:
#     max_compressed_body_bytes: 32mb   # Max compressed shipper request body
#     max_decompressed_body_bytes: 256mb # Max decoded shipper request body
#   mode:                            # Ingest parsing: full or lightweight (empty = full)

# HTTP server configuration.
# http:
#   idle_timeout: 120s               # HTTP keep-alive idle timeout
#   shutdown_timeout: 30s            # Graceful shutdown timeout
#   read_header_timeout: 10s         # Max time allowed to read request headers
#   rate_limit: 0                    # Requests per second per IP (0 = unlimited)

# Native syslog receiver configuration.
# syslog:
#   udp:                              # UDP listen address, e.g. ":5514" (empty = disabled)
#   tcp:                              # TCP listen address, e.g. ":5514" (empty = disabled)
#   tls: false                        # Wrap TCP with server TLS config
#   parser: auto                      # auto, rfc5424, rfc3164, raw
#   framing: auto                     # auto, octet-counting, non-transparent
#   trailer: auto                     # auto, lf, nul, crlf
#   default_timezone: Local           # Timezone for RFC 3164 timestamps
#   default_hostname:                 # Hostname used when wire value is missing/"-"
#   index: main                       # Target index
#   sourcetype: syslog                # Base sourcetype, suffixed by parsed dialect
#   use_peer_as_source: true          # Set source to udp://peer or tcp://peer
#   max_message_bytes: 65536          # Hard cap for a single syslog message
#   udp_read_buffer: 2mb              # UDP socket receive buffer
#   tcp_idle_timeout: 5m              # TCP connection idle timeout
#   tcp_max_connections: 1000         # Max concurrent TCP syslog connections
#   batch_size: 1000                  # Flush after this many events
#   batch_timeout: 200ms              # Flush after this much idle time

# TLS/HTTPS configuration.
# tls:
#   enabled: false                   # Enable TLS (auto self-signed if no cert/key)
#   cert_file:                       # Path to PEM certificate file
#   key_file:                        # Path to PEM private key file

# Authentication configuration.
# auth:
#   enabled: false                   # Enable API key authentication

# Connection profiles for multi-server setups.
# profiles:
#   staging:
#     url: https://staging.example.com:3100
#     token: ""
#   production:
#     url: https://prod.example.com:3100
#     token: ""
