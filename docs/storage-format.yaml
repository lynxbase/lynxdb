binary_versions:
  - binary: v0.1.8 and later
    reads: "1,2"
    writes: "2"
    marker_accepts: "1,2"
    notes: A fresh data directory gets LSGFMT v2; an existing LSGFMT v1 marker is kept
  - binary: v0.1.6, v0.1.7
    reads: "1"
    writes: "1"
    marker_accepts: "1"
    notes: First releases with the FORMAT marker
capabilities:
  - bit: 0
    name: ColumnZSTD
    class: required
    description: A column chunk uses ZSTD layer-2 compression.
  - bit: 1
    name: RangeBSI
    class: optional
    description: The segment carries range bitmap sections.
magics:
  - magic: LSG1
    role: Segment file magic for format-major 1
  - magic: LSG2
    role: Segment file magic for format-major 2
  - magic: LSGE
    role: Footer payload magic
  - magic: LSIX
    role: Inverted-index region magic
  - magic: LSPK
    role: Sparse primary-index region magic
  - magic: LSBL
    role: Per-row-group bloom region magic
