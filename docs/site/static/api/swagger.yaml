openapi: 3.0.3
info:
  title: LynxDB API
  version: 1.0.0
  description: |
    HTTP API of LynxDB, a columnar log store queried with OpenSearch Piped Processing Language (PPL).

    Queries start with a source (`source=main ...`) or a source command (`describe main`),
    followed by `| command` stages: `source=main status>=500 | stats count() as errors by host | sort - errors`.

    ## Envelopes

    Successful JSON responses wrap the payload in `data`, with an optional `meta` object.
    Errors use `{"error": {"code", "message", "suggestion"}}`; query compile errors add
    `position` (`line`, `column`) and `expected`.

    Compatibility endpoints (Elasticsearch, Splunk HEC, OTLP) answer in the format of their protocol.

    ## Authentication

    Off by default. When on, every `/api/...` route needs `Authorization: Bearer <token>`,
    `ApiKey <base64(id:secret)>` or `Basic <base64(user:token)>`. SSE clients may pass `_token`
    as a query parameter. `/health`, `/metrics` and routes outside `/api/` are not checked by the API key middleware.
  contact:
    name: LynxDB
    url: https://lynxdb.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:3100
    description: Local server

tags:
  - name: Query
    description: Run PPL queries, inspect plans, list the PPL catalog, manage jobs
  - name: Live
    description: Live tail and event histogram
  - name: Schema
    description: Fields and sources from stored data
  - name: Ingest
    description: Native ingest endpoints and indexes
  - name: Server
    description: Health, metrics, status, cache, configuration and profiling
  - name: Auth
    description: API key management (only when authentication is on)
  - name: Elasticsearch
    description: Elasticsearch bulk ingest and setup probe stubs
  - name: Splunk HEC
    description: Splunk HTTP Event Collector ingest
  - name: OTLP
    description: OpenTelemetry log ingest

security:
  - BearerAuth: []
  - ApiKeyAuth: []
  - BasicAuth: []
  - {}

paths:

  # QUERY

  /api/v1/query:
    post:
      operationId: queryPost
      tags: [Query]
      summary: Run a PPL query
      description: |
        Runs a PPL query and returns the result, or a job handle.

        | `wait` | Mode | Response |
        |---|---|---|
        | absent or `null` | sync | `200` with the result; `202` with a job handle if the query outlives `query.sync_timeout` (30s) |
        | `0` | async | `202` with a job handle at once |
        | `N` > 0 | hybrid | `200` if the query finishes within N seconds, otherwise `202` with a job handle |

        Event queries return `data.type: events` with an `events` array. Queries whose result comes from
        an aggregation (`stats`, `timechart`, `chart`, `top`, `rare`, `describe`, `transpose`) return
        `data.type: aggregate` with `columns` and `rows`. Built-in columns come first, then the others alphabetically.

        Compile errors answer `400` (`SYNTAX_ERROR`, `SEMANTIC_ERROR`, `TYPE_ERROR`, `PLANNING_ERROR`) or
        `422` (`UNSUPPORTED_COMMAND`, `UNSUPPORTED_FUNCTION`, `UNSUPPORTED_FEATURE`). Failures while running answer
        `500 EXECUTION_ERROR`, including constructs the execution engine cannot run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              events:
                summary: Events
                value:
                  q: 'source=main level=ERROR status>=500 | fields host, status, path | head 3'
              aggregate:
                summary: Aggregation over the last hour
                value:
                  q: 'source=main status>=500 | stats count() as errors, avg(response_time) as avg_ms by host | sort - errors | head 10'
                  from: '-1h'
              hybrid:
                summary: Wait up to 5 seconds, then return a job handle
                value:
                  q: 'source=main | stats count() by span(_time, 1h), level'
                  from: '-30d'
                  wait: 5
              async:
                summary: Return a job handle at once
                value:
                  q: 'source=main | stats dc(user) as users by host'
                  wait: 0
              paged:
                summary: Third page of 3 rows
                value:
                  q: 'source=main | stats count() as n by path | sort - n'
                  limit: 3
                  offset: 6
      responses:
        '200':
          description: The query finished
          headers:
            X-Query-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              examples:
                events:
                  summary: Event result
                  value:
                    data:
                      type: events
                      events:
                        - {host: api-02, path: /api/v1/orders, status: 500}
                        - {host: web-01, path: /api/v1/users, status: 503}
                        - {host: api-01, path: /api/v1/search, status: 503}
                      total: 3
                      has_more: false
                    meta:
                      took_ms: 0
                      scanned: 33
                      query_id: qry_f24fb85c3a02ebe2
                      stats:
                        rows_scanned: 33
                        rows_returned: 3
                        indexes_used: [main]
                aggregate:
                  summary: Aggregate result
                  value:
                    data:
                      type: aggregate
                      columns: [host, avg_ms, errors]
                      rows:
                        - [api-02, 439, 48]
                        - [web-02, 355.4, 43]
                        - [web-03, 439.3, 41]
                      total_rows: 3
                      has_more: false
                    meta:
                      took_ms: 1
                      scanned: 1003
                      query_id: qry_4ab386b7cc5e94aa
        '202':
          description: The query runs as a job; poll `/api/v1/query/jobs/{id}` or follow its SSE stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandleResponse'
              example:
                data:
                  type: job
                  job_id: qry_0f8eeb0e72818e85
                  status: running
                meta:
                  query_id: qry_0f8eeb0e72818e85
        '400':
          $ref: '#/components/responses/QueryError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedQuery'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ExecutionError'
        '503':
          $ref: '#/components/responses/PoolExhausted'
    get:
      operationId: queryGet
      tags: [Query]
      summary: Run a PPL query from query-string parameters
      description: Sync mode only. Returns the same envelope as `POST /api/v1/query`.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: 'source=main status>=500 | stats count() as errors by host'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
            maximum: 50000
        - name: format
          in: query
          schema:
            type: string
            enum: [json]
      responses:
        '200':
          description: The query finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '202':
          description: The query outlived `query.sync_timeout` and runs as a job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandleResponse'
        '400':
          $ref: '#/components/responses/QueryError'
        '422':
          $ref: '#/components/responses/UnsupportedQuery'
        '500':
          $ref: '#/components/responses/ExecutionError'

  /api/v1/query/stream:
    post:
      operationId: queryStream
      tags: [Query]
      summary: Run a PPL query and stream rows as NDJSON
      description: |
        Writes one JSON object per row, then `{"__meta": {"total", "scanned", "took_ms"}}`.
        If execution fails after output has started, the last line is
        `{"__error": {"code": "EXECUTION_ERROR", "message": "..."}}` and no `__meta` line follows.
        Compile errors answer with the normal error envelope before any row.

        Accepts `q`/`query`, `from`/`earliest` and `to`/`latest`.
        `limit`, `offset`, `wait`, `profile`, and `format` are rejected with `400 VALIDATION_ERROR`.
        No row cap applies; use `head` in the query.
        Closing the connection cancels the query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryStreamRequest'
            example:
              q: 'source=main | stats count() as n by level'
      responses:
        '200':
          description: NDJSON rows
          content:
            application/x-ndjson:
              schema:
                type: string
              example: |
                {"level":"WARN","n":347}
                {"level":"INFO","n":359}
                {"level":"ERROR","n":294}
                {"__meta":{"scanned":1000,"took_ms":0,"total":3}}
        '400':
          $ref: '#/components/responses/QueryError'
        '422':
          $ref: '#/components/responses/UnsupportedQuery'

  /api/v1/query/explain:
    get:
      operationId: queryExplain
      tags: [Query]
      summary: Compile a PPL query and return its plans
      description: |
        Returns the logical and optimized plans and the scan hints without running the query.
        An invalid query answers `200` with `is_valid: false` and the compile error.
        With `analyze=true`, a valid query also runs and its statistics are returned as `execution`.
      parameters:
        - name: q
          in: query
          required: true
          description: The PPL query (`query` is an alias)
          schema:
            type: string
          example: 'source=main status>=500 | stats count() as errors by host | sort - errors | head 5'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: analyze
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Plans, or compile errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
              examples:
                valid:
                  summary: Valid query
                  value:
                    data:
                      is_valid: true
                      errors: []
                      parsed:
                        result_type: aggregate
                        estimated_cost: high
                        uses_full_scan: true
                        fields_read: [_time, host, status]
                        search_terms: null
                        has_time_bounds: false
                        logical_plan: "Limit(5)\n└─ Sort(errors DESC NULLS LAST)\n   └─ Project(errors, host)\n      └─ Aggregate(errors = count() BY host)\n         └─ Filter(status >= 500)\n            └─ Scan(main)\n"
                        optimized_plan: "TopN(5, errors DESC NULLS LAST)\n└─ Project(errors, host)\n   └─ Aggregate(errors = count() BY host)\n      └─ Filter(status >= 500)\n         └─ Scan(main) columns=[_time, host, status]\n"
                        compile_ms: 0.057
                        optimizer_rules:
                          - {name: sort-limit-to-topn, count: 1}
                        source_scope:
                          type: single
                          sources: [main]
                          total_sources_available: 2
                invalid:
                  summary: Invalid query
                  value:
                    data:
                      is_valid: false
                      errors:
                        - kind: semantic
                          message: field status not found
                          position: {line: 1, column: 50}
                          suggestion: 'available fields: n, host'
        '400':
          $ref: '#/components/responses/QueryError'

  /api/v1/catalog:
    get:
      operationId: catalog
      tags: [Query]
      summary: PPL commands and functions with their support level
      description: |
        The catalog is fixed for a binary. Responses carry a strong `ETag` and
        `Cache-Control: public, max-age=86400`; a matching `If-None-Match` answers `304`.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: The catalog
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
              example:
                data:
                  language: ppl
                  commands:
                    - {name: bin, support: partial, notes: 'span= with numeric and time units; bins, minspan, aligntime, start, end and logarithmic spans are unsupported'}
                    - {name: dedup, support: full}
                    - {name: kmeans, support: unsupported, notes: 'it runs the OpenSearch ML Commons plugin, which LynxDB does not have'}
                  functions:
                    - {name: round, kind: scalar, category: math, support: full, doc: 'x rounded half away from zero to d decimal places (default 0).'}
                    - {name: if, kind: scalar, support: full, lowering: CASE}
                    - {name: geoip, kind: scalar, support: unsupported, unsupported: LynxDB has no GeoIP database}
                    - {name: count, kind: aggregate, category: aggregation, support: full, doc: 'Number of rows, or with an argument the number of rows where it is not NULL.'}
        '304':
          description: Not modified

  /api/v1/query/jobs:
    get:
      operationId: listJobs
      tags: [Query]
      summary: List running and recent jobs
      description: Finished jobs are kept for `query.job_ttl` (5m). Every query, sync ones included, is a job.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [running, done, error, canceled, complete, failed, cancelled]
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
              example:
                data:
                  jobs:
                    - job_id: qry_0f8eeb0e72818e85
                      query: 'source=main | stats count() as n, avg(response_time) as avg_ms by level'
                      status: done
                      created_at: '2026-11-17T10:38:26.755295Z'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/query/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: getJob
      tags: [Query]
      summary: Get a job's status and result
      responses:
        '200':
          description: The job. `progress` while running, `results` when done, `error` when failed or canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
              examples:
                running:
                  summary: Running
                  value:
                    data:
                      type: job
                      job_id: qry_0f8eeb0e72818e85
                      status: running
                      query: 'source=main | stats count() as n by level'
                      progress:
                        phase: scanning_segments
                        segments_total: 30
                        segments_scanned: 12
                        segments_dispatched: 18
                        segments_skipped_index: 4
                        segments_skipped_time: 2
                        segments_skipped_stats: 0
                        segments_skipped_bloom: 3
                        segments_skipped_range: 0
                        buffered_events: 0
                        rows_read_so_far: 120000
                        elapsed_ms: 1840
                done:
                  summary: Done
                  value:
                    data:
                      type: job
                      job_id: qry_0f8eeb0e72818e85
                      status: done
                      query: 'source=main | stats count() as n, avg(response_time) as avg_ms by level'
                      created_at: '2026-11-17T10:38:26.755295Z'
                      completed_at: '2026-11-17T10:38:26.756746Z'
                      results:
                        type: aggregate
                        columns: [avg_ms, level, n]
                        rows:
                          - [411.21325648414984, WARN, 347]
                          - [414.4930362116992, INFO, 359]
                          - [408.1224489795918, ERROR, 294]
                        total_rows: 3
                        has_more: false
                    meta:
                      took_ms: 1
                      scanned: 1000
                      query_id: qry_0f8eeb0e72818e85
                error:
                  summary: Failed
                  value:
                    data:
                      type: job
                      job_id: qry_d4e1f2a0b1c2d3e4
                      status: error
                      error:
                        code: QUERY_MEMORY_EXCEEDED
                        message: query exceeded memory budget
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelJob
      tags: [Query]
      summary: Cancel a job
      description: Needs `admin` scope. `canceled` is `true` when this request stopped a running job.
      responses:
        '200':
          description: The job's state after the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelJobResponse'
              example:
                data:
                  job_id: qry_0f8eeb0e72818e85
                  status: canceled
                  canceled: true
                  completed_at: '2026-11-17T10:38:28Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/query/jobs/{id}/stream:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: streamJob
      tags: [Query]
      summary: Follow a job over Server-Sent Events
      description: |
        | Event | Data |
        |---|---|
        | `progress` | About once a second: `phase`, `scanned`, `segments_total`, `percent`, `events_matched`, `elapsed_ms`, `eta_ms`, optional `preview` and `preview_version` |
        | `complete` | `{"data": <result>, "meta": {"took_ms", "scanned", "stats"}}` |
        | `failed` | `{"code", "message"}` |
        | `canceled` | `{"scanned", "elapsed_ms"}` |
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: complete
                data: {"data":{"columns":["avg_ms","level","n"],"has_more":false,"rows":[[411.2,"WARN",347]],"total_rows":1,"type":"aggregate"},"meta":{"scanned":1000,"took_ms":1}}
        '404':
          $ref: '#/components/responses/NotFound'

  # LIVE

  /api/v1/tail:
    get:
      operationId: liveTail
      tags: [Live]
      summary: Live tail over Server-Sent Events
      description: |
        Replays the last `count` matching stored events, sends `catchup_done`, then streams events as they arrive.
        `q` is a full PPL query. Only row-by-row commands are allowed; commands that need all input
        (`stats`, `timechart`, `chart`, `top`, `rare`, `sort`, `reverse`, `eventstats`, `streamstats`,
        `trendline`, `join`, `lookup`, `append`, `appendcol`, `union`, `multisearch`, `transpose`, `addtotals`,
        `addcoltotals`, `mvcombine`, `patterns`, `describe`) answer `422`.

        | Event | Data |
        |---|---|
        | `result` | One event |
        | `catchup_done` | `{"count": N}` |
        | `heartbeat` | `{"ts"}`, every 15 seconds |
        | `warning` | `{"type": "events_dropped", "count", "total_dropped"}` |
        | `close` | `{"reason": "max_session_duration"}` |
        | `error` | `{"error"}` |
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - BasicAuth: []
        - TokenQuery: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: 'source=main level=ERROR | where status >= 500 | fields _time, host, status'
        - name: count
          in: query
          schema:
            type: integer
            default: 100
            maximum: 10000
        - name: from
          in: query
          schema:
            type: string
            default: '-1h'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: result
                data: {"_time":"2026-11-17T10:32:54.573324Z","host":"web-01","status":502}

                event: catchup_done
                data: {"count":1}

                event: heartbeat
                data: {"ts":"2026-11-17T10:45:12Z"}
        '400':
          description: 'Missing `q` (`{"error": "missing required parameter: q"}`), or a compile error in the query error envelope'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BareError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The query needs all its input, or uses unsupported PPL
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BareError'
                  - $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Aggregate is not supported in live tail: it needs all input rows before producing output'
        '429':
          description: '`tail.max_concurrent_sessions` reached; `Retry-After: 5`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareError'
              example:
                error: too many active tail sessions

  /api/v1/histogram:
    get:
      operationId: histogram
      tags: [Live]
      summary: Event counts per time bucket
      description: |
        Counts every event in the range from segment metadata; takes no query.
        The interval is the range divided by `buckets`, rounded to the nearest of
        1s, 5s, 30s, 1m, 5m, 15m, 1h, 6h, 24h. With `group_by`, buckets carry `counts` by field value;
        events without the field count under `other`.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: buckets
          in: query
          schema:
            type: integer
            default: 60
            maximum: 1000
        - name: index
          in: query
          schema:
            type: string
        - name: group_by
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistogramResponse'
              examples:
                counts:
                  summary: Counts
                  value:
                    data:
                      interval: 15m0s
                      buckets:
                        - {time: '2026-11-17T09:18:00Z', count: 0}
                        - {time: '2026-11-17T09:33:00Z', count: 113}
                      total: 113
                    meta:
                      took_ms: 0
                grouped:
                  summary: Grouped by level
                  value:
                    data:
                      interval: 15m0s
                      buckets:
                        - {time: '2026-11-17T09:18:00Z', counts: {}}
                        - {time: '2026-11-17T09:33:00Z', counts: {ERROR: 33, INFO: 35, WARN: 43, other: 2}}
                      total: 113
                    meta:
                      took_ms: 0
        '400':
          $ref: '#/components/responses/ValidationError'

  # SCHEMA

  /api/v1/fields:
    get:
      operationId: listFields
      tags: [Schema]
      summary: Fields found in stored segments
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          example: st
      responses:
        '200':
          description: Fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldsResponse'
              example:
                data:
                  fields:
                    - {name: status, type: int, coverage: 100, total_count: 1000}

  /api/v1/fields/{name}/values:
    get:
      operationId: fieldValues
      tags: [Schema]
      summary: Most common values of a field
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: level
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: from
          in: query
          description: Start of the time range (`since` is an alias)
          schema:
            type: string
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldValuesResponse'
              example:
                data:
                  field: level
                  values:
                    - {value: INFO, count: 359, percent: 35.72}
                    - {value: WARN, count: 347, percent: 34.53}
                    - {value: ERROR, count: 294, percent: 29.25}
                  unique_count: 4
                  total_count: 1005
                meta:
                  took_ms: 0

  /api/v1/sources:
    get:
      operationId: listSources
      tags: [Schema]
      summary: Event sources with counts and time span
      parameters:
        - name: pattern
          in: query
          description: Glob on the source name (`*`, `?`)
          schema:
            type: string
          example: 'ng*'
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
              example:
                data:
                  pattern: 'ng*'
                  sources:
                    - {name: nginx, event_count: 2, first_event: '2026-11-17T10:43:02Z', last_event: '2026-11-17T10:43:02Z'}
                meta:
                  took_ms: 0

  # INGEST

  /api/v1/ingest:
    post:
      operationId: ingest
      tags: [Ingest]
      summary: Ingest a JSON array of events
      description: |
        Takes a top-level JSON array. A single object, NDJSON or plain text answers `400 INVALID_JSON`.
        If a later batch fails after earlier ones were stored, the response is `200` with `failed` and a `warning`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StructuredIngestEvent'
            example:
              - time: 1763370000
                event: user login
                source: auth-api
                sourcetype: app
                host: web-01
                fields: {user_id: 42, level: info, ip: 10.0.1.5}
      responses:
        '200':
          $ref: '#/components/responses/IngestAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Backpressure'

  /api/v1/ingest/raw:
    post:
      operationId: ingestRaw
      tags: [Ingest]
      summary: Ingest newline-delimited text
      description: |
        Each non-empty line is one event, stored in `_raw`. When the body is cut off by `ingest.max_body_size`
        after some events were stored, the response is `200` with `truncated: true` and a `warning`.
      parameters:
        - name: X-Source
          in: header
          schema:
            type: string
            default: http
            maxLength: 256
        - name: X-Source-Type
          in: header
          schema:
            type: string
            default: raw
            maxLength: 256
        - name: X-Index
          in: header
          schema:
            type: string
            default: main
            maxLength: 256
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: |
              2026-11-17T08:00:00.105Z host=web-03 level=ERROR method=GET path=/api/v1/users status=502
              2026-11-17T08:00:00.211Z host=web-01 level=INFO method=GET path=/api/v1/health status=200
      responses:
        '200':
          $ref: '#/components/responses/IngestAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Backpressure'

  /api/v1/ingest/hec:
    post:
      operationId: ingestHEC
      tags: [Ingest, Splunk HEC]
      summary: Ingest Splunk HEC events with a LynxDB API key
      description: One HEC event object per line. Authenticates with LynxDB API keys, not `Splunk` tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HECEvent'
      responses:
        '200':
          $ref: '#/components/responses/HECSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ingest/bulk:
    post:
      operationId: ingestBulk
      tags: [Ingest, Elasticsearch]
      summary: Elasticsearch bulk ingest (alias of /api/v1/es/_bulk)
      requestBody:
        $ref: '#/components/requestBodies/ESBulk'
      responses:
        '200':
          $ref: '#/components/responses/ESBulkResult'
        '400':
          $ref: '#/components/responses/ESError'

  /api/v1/indexes:
    get:
      operationId: listIndexes
      tags: [Ingest]
      summary: List indexes
      responses:
        '200':
          description: Indexes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexesResponse'
              example:
                data:
                  indexes:
                    - {name: main, retention_period: 2160h0m0s, replication_factor: 1}
    post:
      operationId: createIndex
      tags: [Ingest]
      summary: Create an index
      description: Needs a root key when authentication is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndexRequest'
            example:
              name: audit
              retention_days: 365
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIndexResponse'
              example:
                data: {name: audit, status: created}
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  # SERVER

  /health:
    get:
      operationId: health
      tags: [Server]
      summary: Health check
      security: []
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data: {status: healthy, degraded: false, version: 0.4.0}

  /metrics:
    get:
      operationId: prometheusMetrics
      tags: [Server]
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string

  /api/v1/status:
    get:
      operationId: status
      tags: [Server]
      summary: Operational snapshot
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                data:
                  version: 0.4.0
                  uptime_seconds: 485
                  health: healthy
                  storage: {used_bytes: 246702}
                  events: {total: 1007, today: 116}
                  queries: {active: 0}
                  tail: {active_sessions: 0, subscriber_count: 0, total_dropped_events: 0}
                  retention: {oldest_event: '2025-01-15T08:00:00Z'}

  /api/v1/stats:
    get:
      operationId: stats
      tags: [Server]
      summary: Storage and event counters
      responses:
        '200':
          description: Counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

  /api/v1/metrics:
    get:
      operationId: storageMetrics
      tags: [Server]
      summary: Storage metrics as JSON
      responses:
        '200':
          description: Metrics with `ingest`, `flush`, `segment`, `compaction`, `compaction_levels`, `tiering`, `cache`, `query`, `pruning`, `system_write_amplification`, `uptime_seconds` and optional `adaptive_compaction`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataObject'

  /api/v1/compaction/history:
    get:
      operationId: compactionHistory
      tags: [Server]
      summary: Recorded compactions
      parameters:
        - name: since
          in: query
          description: RFC 3339 time
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Compactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompactionHistoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/cache/stats:
    get:
      operationId: cacheStats
      tags: [Server]
      summary: Query result cache statistics
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
              example:
                data: {hits: 2, misses: 26, hit_rate: 0.0714, entries: 25, size_bytes: 1110668, evictions: 0}

  /api/v1/cache:
    delete:
      operationId: cacheClear
      tags: [Server]
      summary: Clear the query result cache
      description: Needs `admin` scope.
      responses:
        '200':
          description: Cleared
          content:
            application/json:
              example:
                data: {status: cleared}
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/config:
    get:
      operationId: getConfig
      tags: [Server]
      summary: Running configuration
      description: Needs `admin` scope. Top-level keys are `listen`, `data_dir`, `retention`, `log_level`, `storage`, `query`, `ingest`, `http`, `syslog`, `tail`, `tls`, `auth`, `server`, `buffer_manager`, `profiles`.
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataObject'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: patchConfig
      tags: [Server]
      summary: Change the running configuration
      description: |
        Needs a root key. Accepted top-level keys: `retention`, `log_level`, `listen`, `query`, `ingest`,
        `storage`, `http`, `syslog`. Changes are not written to the config file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              log_level: debug
              query:
                max_query_runtime: 10m
      responses:
        '200':
          description: The resulting configuration and the settings that need a restart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPatchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/debug/pprof/{profile}:
    get:
      operationId: pprof
      tags: [Server]
      summary: Go runtime profiles
      parameters:
        - name: profile
          in: path
          required: true
          schema:
            type: string
            enum: [profile, trace, heap, allocs, goroutine, mutex, block, threadcreate, cmdline, symbol]
        - name: seconds
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Profile data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # AUTH

  /api/v1/auth/keys:
    post:
      operationId: createKey
      tags: [Auth]
      summary: Create an API key
      description: Needs a root key. Answers `404` when authentication is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            example:
              name: filebeat
              scope: ingest
              expires_in: 90d
              description: edge shipper
      responses:
        '201':
          description: The key, with its token shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreatedKey'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listKeys
      tags: [Auth]
      summary: List API keys
      description: Needs a root key. Tokens are not returned.
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      keys:
                        type: array
                        items:
                          $ref: '#/components/schemas/APIKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/keys/{id}:
    delete:
      operationId: revokeKey
      tags: [Auth]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The key is the last root key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: LAST_ROOT_KEY
                  message: Cannot revoke the last root key. Use rotate-root instead.

  /api/v1/auth/rotate-root:
    post:
      operationId: rotateRoot
      tags: [Auth]
      summary: Replace the calling root key
      responses:
        '200':
          description: The replacement root key, with its token shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RotateRootResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ELASTICSEARCH

  /_bulk:
    post:
      operationId: esBulkRoot
      tags: [Elasticsearch]
      summary: Elasticsearch bulk ingest
      description: |
        `index` and `create` actions are stored; `update` and `delete` fail per item.
        The target index is the data stream name, else `_index`, else the path index, else a `target_index`
        field of the document, else `default`. Outside `/api/`, so with authentication on use `/api/v1/es/_bulk`.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/MsgField'
        - $ref: '#/components/parameters/TimeField'
      requestBody:
        $ref: '#/components/requestBodies/ESBulk'
      responses:
        '200':
          $ref: '#/components/responses/ESBulkResult'
        '400':
          $ref: '#/components/responses/ESError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ESError'

  /{index}/_bulk:
    post:
      operationId: esBulkIndex
      tags: [Elasticsearch]
      summary: Elasticsearch bulk ingest into an index
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ESIndex'
        - $ref: '#/components/parameters/MsgField'
        - $ref: '#/components/parameters/TimeField'
      requestBody:
        $ref: '#/components/requestBodies/ESBulk'
      responses:
        '200':
          $ref: '#/components/responses/ESBulkResult'
        '400':
          $ref: '#/components/responses/ESError'

  /_data_stream/{data_stream}/_bulk:
    post:
      operationId: esBulkDataStream
      tags: [Elasticsearch]
      summary: Elasticsearch bulk ingest into a data stream
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/DataStream'
      requestBody:
        $ref: '#/components/requestBodies/ESBulk'
      responses:
        '200':
          $ref: '#/components/responses/ESBulkResult'
        '400':
          $ref: '#/components/responses/ESError'

  /api/v1/es/_bulk:
    post:
      operationId: esBulk
      tags: [Elasticsearch]
      summary: Elasticsearch bulk ingest (authenticated)
      description: Needs `ingest` scope when authentication is on.
      parameters:
        - $ref: '#/components/parameters/MsgField'
        - $ref: '#/components/parameters/TimeField'
      requestBody:
        $ref: '#/components/requestBodies/ESBulk'
      responses:
