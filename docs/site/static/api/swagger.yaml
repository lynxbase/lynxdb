      operationId: esPutIndexTemplatePrefixed
      tags: [Elasticsearch]
      summary: Acknowledge an index template without storing it (prefixed)
      responses:
        '200':
          $ref: '#/components/responses/ESAcknowledged'

  /api/v1/es/_ingest/pipeline/{name}:
    parameters:
      - $ref: '#/components/parameters/StubName'
    get:
      operationId: esGetIngestPipelinePrefixed
      tags: [Elasticsearch]
      summary: Ingest pipeline probe; always 404 (prefixed)
      responses:
        '404':
          $ref: '#/components/responses/ESStub'
    put:
      operationId: esPutIngestPipelinePrefixed
      tags: [Elasticsearch]
      summary: Unsupported ingest pipeline write
      responses:
        '501':
          $ref: '#/components/responses/ESUnsupported'

  /api/v1/es/_nodes/{path}:
    get:
      operationId: esNodesPrefixed
      tags: [Elasticsearch]
      summary: Minimal node HTTP info (prefixed)
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ESStub'

  /api/v1/es/_data_stream/{name}:
    parameters:
      - $ref: '#/components/parameters/StubName'
    get:
      operationId: esGetDataStreamPrefixed
      tags: [Elasticsearch]
      summary: Empty data stream list (prefixed)
      responses:
        '200':
          $ref: '#/components/responses/ESStub'
    put:
      operationId: esPutDataStreamPrefixed
      tags: [Elasticsearch]
      summary: Acknowledge a data stream without storing it (prefixed)
      responses:
        '200':
          $ref: '#/components/responses/ESAcknowledged'

  /api/v1/es/_alias:
    get:
      operationId: esAliasPrefixed
      tags: [Elasticsearch]
      summary: Empty aliases object (prefixed)
      responses:
        '200':
          $ref: '#/components/responses/ESStub'

  /api/v1/es/_search:
    get:
      operationId: esSearchPrefixed
      tags: [Elasticsearch]
      summary: Empty search hits (prefixed)
      responses:
        '200':
          $ref: '#/components/responses/ESStub'

  /api/v1/es/_security/user/_authenticate:
    post:
      operationId: esAuthenticatePrefixed
      tags: [Elasticsearch]
      summary: Authenticated user stub (prefixed)
      responses:
        '200':
          $ref: '#/components/responses/ESStub'

  # SPLUNK HEC

  /services/collector:
    post:
      operationId: hecCollector
      tags: [Splunk HEC]
      summary: HEC event ingest
      description: Same as `/services/collector/event`.
      security:
        - SplunkToken: []
      parameters:
        - $ref: '#/components/parameters/SplunkChannel'
      requestBody:
        $ref: '#/components/requestBodies/HECEvents'
      responses:
        '200':
          $ref: '#/components/responses/HECSuccess'
        '401':
          $ref: '#/components/responses/HECUnauthorized'
        '404':
          $ref: '#/components/responses/HECDisabled'

  /services/collector/event:
    post:
      operationId: hecEvent
      tags: [Splunk HEC]
      summary: HEC event ingest
      description: |
        One HEC event object per line; invalid lines are skipped and counted in `skipped_lines`.
        Events are stored in the `main` index. Any non-empty `Splunk` token is accepted; LynxDB API keys are not checked.
      security:
        - SplunkToken: []
      parameters:
        - $ref: '#/components/parameters/SplunkChannel'
      requestBody:
        $ref: '#/components/requestBodies/HECEvents'
      responses:
        '200':
          $ref: '#/components/responses/HECSuccess'
        '401':
          $ref: '#/components/responses/HECUnauthorized'
        '404':
          $ref: '#/components/responses/HECDisabled'

  /services/collector/raw:
    post:
      operationId: hecRaw
      tags: [Splunk HEC]
      summary: HEC raw ingest
      security:
        - SplunkToken: []
      parameters:
        - $ref: '#/components/parameters/SplunkChannel'
        - {name: source, in: query, schema: {type: string}}
        - {name: sourcetype, in: query, schema: {type: string}}
        - {name: host, in: query, schema: {type: string}}
        - {name: index, in: query, schema: {type: string}}
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          $ref: '#/components/responses/HECSuccess'
        '401':
          $ref: '#/components/responses/HECUnauthorized'

  /services/collector/ack:
    post:
      operationId: hecAck
      tags: [Splunk HEC]
      summary: Check acknowledgement IDs for a channel
      security:
        - SplunkToken: []
      parameters:
        - $ref: '#/components/parameters/SplunkChannel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acks:
                  type: array
                  items:
                    type: integer
            example:
              acks: [1, 2]
      responses:
        '200':
          description: Status of each ID
          content:
            application/json:
              example:
                acks: {'1': true, '2': false}
        '400':
          description: 'Invalid body (`{"text": "Invalid ack request", "code": 5}`)'

  /services/collector/health:
    get:
      operationId: hecHealth
      tags: [Splunk HEC]
      summary: HEC health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              example:
                text: HEC is healthy
                code: 17
        '404':
          $ref: '#/components/responses/HECDisabled'

  # OTLP

  /api/v1/otlp/v1/logs:
    post:
      operationId: otlpLogsJSON
      tags: [OTLP]
      summary: OTLP logs as JSON on the API port
      description: |
        OTLP JSON only; `application/x-protobuf` answers `415`. `resource.attributes["deployment.environment"]`
        selects the target index.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Stored; the body is `{}`
        '400':
          $ref: '#/components/responses/ValidationError'
        '415':
          description: Protobuf is not accepted on this route

  /v1/logs:
    servers:
      - url: http://localhost:4318
        description: OTLP/HTTP listener (`ingest.otlp.http_listen`)
    post:
      operationId: otlpLogs
      tags: [OTLP]
      summary: OTLP/HTTP logs
      description: Protobuf or JSON. Records go to the `main` index with `_sourcetype` `otlp`.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: An empty ExportLogsServiceResponse
        '400':
          description: Invalid protobuf or JSON
        '415':
          description: Unsupported content type
        '503':
          description: Ingest failed; `Retry-After` is set

  /v1/traces:
    servers:
      - url: http://localhost:4318
    post:
      operationId: otlpTraces
      tags: [OTLP]
      summary: OTLP traces; accepted and discarded
      security:
        - {}
      responses:
        '200':
          description: An empty ExportTraceServiceResponse

  /v1/metrics:
    servers:
      - url: http://localhost:4318
    post:
      operationId: otlpMetrics
      tags: [OTLP]
      summary: OTLP metrics; accepted and discarded
      security:
        - {}
      responses:
        '200':
          description: An empty ExportMetricsServiceResponse

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    BasicAuth:
      type: http
      scheme: basic
      description: The password is the token; the user name is ignored.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: '`ApiKey <base64(id:token)>`, as sent by Elasticsearch clients.'
    TokenQuery:
      type: apiKey
      in: query
      name: _token
      description: For SSE clients that cannot set headers.
    SplunkToken:
      type: apiKey
      in: header
      name: Authorization
      description: '`Splunk <token>`'

  parameters:
    From:
      name: from
      in: query
      description: 'Start time: relative (`-1h`, `-7d`, `-1d@d`), `now`, or ISO 8601'
      schema:
        type: string
      example: '-1h'
    To:
      name: to
      in: query
      description: End time, same formats as `from`
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: qry_0f8eeb0e72818e85
    ESIndex:
      name: index
      in: path
      required: true
      schema:
        type: string
    DataStream:
      name: data_stream
      in: path
      required: true
      schema:
        type: string
    StubName:
      name: name
      in: path
      required: true
      schema:
        type: string
    MsgField:
      name: _msg_field
      in: query
      description: Document field to store as `_raw` instead of the whole document
      schema:
        type: string
    TimeField:
      name: _time_field
      in: query
      description: Document field to read the event time from (default `@timestamp`)
      schema:
        type: string
    SplunkChannel:
      name: X-Splunk-Request-Channel
      in: header
      description: When set, events are flushed before the response and an `ackId` is returned
      schema:
        type: string

  requestBodies:
    ESBulk:
      required: true
      content:
        application/x-ndjson:
          schema:
            type: string
          example: |
            {"index":{"_index":"logs"}}
            {"message":"hello from filebeat","@timestamp":"2026-11-17T09:00:00Z","level":"info"}
            {"create":{"_index":"logs"}}
            {"message":"cpu usage high","@timestamp":"2026-11-17T09:00:01Z","host":"web-01"}
    HECEvents:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HECEvent'
          example:
            event: user login succeeded
            time: 1763370000
            host: web-01
            source: auth-service
            sourcetype: json
            fields: {level: info}

  responses:
    QueryError:
      description: The request is invalid or the query does not compile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            syntax:
              summary: SYNTAX_ERROR
              value:
                error:
                  code: SYNTAX_ERROR
                  message: 'syntax error at line 1, column 29: expected an expression'
                  position: {line: 1, column: 29}
                  expected: [expression]
            semantic:
              summary: SEMANTIC_ERROR
              value:
                error:
                  code: SEMANTIC_ERROR
                  message: 'semantic error at line 1, column 50: field status not found (available fields: n, host)'
                  position: {line: 1, column: 50}
                  suggestion: 'available fields: n, host'
            type:
              summary: TYPE_ERROR
              value:
                error:
                  code: TYPE_ERROR
                  message: 'type error at line 1, column 21: expected a boolean expression, got int'
                  position: {line: 1, column: 21}
            planning:
              summary: PLANNING_ERROR
              value:
                error:
                  code: PLANNING_ERROR
                  message: 'planning error: time range: parse from "yesterday-ish": unable to parse time: "yesterday-ish"'
            validation:
              summary: VALIDATION_ERROR
              value:
                error:
                  code: VALIDATION_ERROR
                  message: unsupported format "csv"; only "json" is supported
                  suggestion: Use the default JSON response, or POST /api/v1/query/stream for NDJSON exports.
    UnsupportedQuery:
      description: The query uses PPL that LynxDB does not run
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            command:
              summary: UNSUPPORTED_COMMAND
              value:
                error:
                  code: UNSUPPORTED_COMMAND
                  message: 'unsupported_command error at line 1, column 15: the fieldformat command is not supported: display formatting with prefix and suffix is not implemented; use eval with concat()'
                  position: {line: 1, column: 15}
            function:
              summary: UNSUPPORTED_FUNCTION
              value:
                error:
                  code: UNSUPPORTED_FUNCTION
                  message: 'unsupported_function error at line 1, column 24: function geoip is not supported: LynxDB has no GeoIP database'
                  position: {line: 1, column: 24}
            feature:
              summary: UNSUPPORTED_FEATURE
              value:
                error:
                  code: UNSUPPORTED_FEATURE
                  message: 'unsupported_feature error at line 1, column 30: bin bins= is not supported; use span='
                  position: {line: 1, column: 30}
    ExecutionError:
      description: The query failed while running
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: EXECUTION_ERROR
              message: 'physical.Build: not supported by the execution engine: earliest ordered by a column other than _time'
    PoolExhausted:
      description: The server-wide query memory pool is full
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: QUERY_POOL_EXHAUSTED
              message: query memory pool exhausted
              suggestion: Wait for other queries to complete, or increase query.global_query_pool_bytes.
    TooManyRequests:
      description: Concurrency or rate limit reached
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: rate limit exceeded
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide: Authorization: Bearer <key>'
              suggestion: Run 'lynxdb login' or set LYNXDB_TOKEN environment variable
    Forbidden:
      description: The key lacks the required scope or is not a root key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: 'This operation requires scope: query (your key has scope: ingest)'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: job not found
    PayloadTooLarge:
      description: The body is over a size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ESErrorResponse'
          example:
            error:
              type: request_body_too_large
              reason: compressed body exceeds limit 33554432
            status: 413
    Backpressure:
      description: Ingest is saturated or the server is stopping
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BACKPRESSURE
              message: 'ingest backpressure: compaction falling behind'
    IngestAccepted:
      description: Events stored
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestResponse'
          example:
            data: {accepted: 2, failed: 0}
    ESBulkResult:
      description: Bulk result in Elasticsearch format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ESBulkResponse'
          example:
            took: 14
            errors: false
            items:
              - index: {_id: 7e09be76021487a477741b2e, _index: logs, status: 201, result: created}
              - create: {_id: a7a8e87ecb20d263fe897b43, _index: logs, status: 201, result: created}
    ESError:
      description: Elasticsearch-format error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ESErrorResponse'
          example:
            error:
              type: content_type_exception
              reason: bulk endpoint requires application/x-ndjson or application/json
            status: 400
    ESClusterInfo:
      description: Elasticsearch-style cluster description
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ESClusterInfo'
          example:
            name: lynxdb-host1-90011
            cluster_name: lynxdb
            cluster_uuid: Lp9Zztp3164yLH-aHknLAn
            version:
              number: 8.15.0
              build_flavor: default
              build_type: tarball
              build_hash: lynxdb
              build_date: '2025-01-01T00:00:00.000Z'
              build_snapshot: false
              lucene_version: 9.7.0
              minimum_wire_compatibility_version: 7.17.0
              minimum_index_compatibility_version: 7.0.0
            tagline: You Know, for Logs
    ESStub:
      description: Fixed Elasticsearch-style response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ESEmptyArray:
      description: Empty JSON array
      content:
        application/json:
          schema:
            type: array
            items: {}
            maxItems: 0
    ESAcknowledged:
      description: Acknowledged without storing anything
      content:
        application/json:
          example:
            acknowledged: true
    ESUnsupported:
      description: Unsupported Elasticsearch management endpoint
      content:
        application/json:
          example:
            error: unsupported Elasticsearch management endpoint
            status: 501
    HECSuccess:
      description: Events accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HECResponse'
          example:
            text: Success
            code: 0
    HECUnauthorized:
      description: Missing or invalid Splunk token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HECResponse'
          example:
            text: Token is required
            code: 2
    HECDisabled:
      description: '`ingest.splunk_hec.enabled` is false'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HECResponse'
          example:
            text: HEC is disabled
            code: 4

  schemas:

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - SYNTAX_ERROR
                - SEMANTIC_ERROR
                - TYPE_ERROR
                - PLANNING_ERROR
                - UNSUPPORTED_COMMAND
                - UNSUPPORTED_FUNCTION
                - UNSUPPORTED_FEATURE
                - EXECUTION_ERROR
                - QUERY_TOO_LARGE
                - QUERY_MEMORY_EXCEEDED
                - QUERY_POOL_EXHAUSTED
                - TOO_MANY_REQUESTS
                - VALIDATION_ERROR
                - INVALID_JSON
                - INVALID_REQUEST
                - INVALID_QUERY
                - AUTH_REQUIRED
                - INVALID_TOKEN
                - FORBIDDEN
                - NOT_FOUND
                - LAST_ROOT_KEY
                - BACKPRESSURE
                - SHUTTING_DOWN
                - INTERNAL_ERROR
            message:
              type: string
            suggestion:
              type: string
            position:
              $ref: '#/components/schemas/Position'
            expected:
              type: array
              items:
                type: string
              description: Tokens the parser would have accepted (syntax errors)

    BareError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ESErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            reason:
              type: string
        status:
          type: integer

    Position:
      type: object
      properties:
        line:
          type: integer
        column:
          type: integer

    DataObject:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true

    # Query

    QueryRequest:
      type: object
      properties:
        q:
          type: string
          description: The PPL query. Required unless `query` is set
          example: 'source=main status>=500 | stats count() as errors by host'
        query:
          type: string
          description: Alias for `q`
        from:
          type: string
          description: 'Start time: relative (`-1h`, `-7d`, `-1d@d`), `now`, or ISO 8601. Omit for no lower bound'
        to:
          type: string
          description: End time, same formats as `from`
        earliest:
          type: string
          description: Alias for `from`
        latest:
          type: string
          description: Alias for `to`
        limit:
          type: integer
          default: 1000
          maximum: 50000
          description: Rows to return (`query.default_result_limit`, capped at `query.max_result_limit`)
        offset:
          type: integer
          default: 0
        wait:
          type: number
          nullable: true
          description: Absent or `null` for sync, `0` for async, `N` for hybrid
        profile:
          type: string
          enum: [basic, full, trace]
          description: '`trace` adds per-segment read details to `meta.stats.segment_details`'
        format:
          type: string
          enum: [json]
        lint:
          type: boolean
          default: true
          description: '`false` turns off advisory lints'
        suggestions:
          type: boolean
          default: true
          description: '`false` turns off advisory suggestions'
        lint_limit:
          type: integer
          default: 5
        lint_full:
          type: boolean
          default: false

    QueryStreamRequest:
      type: object
      properties:
        q:
          type: string
          description: The PPL query
        query:
          type: string
        from:
          type: string
        to:
          type: string
        earliest:
          type: string
        latest:
          type: string

    EventsResult:
      type: object
      required: [type, events, total, has_more]
      properties:
        type:
          type: string
          enum: [events]
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          description: Events produced before `offset` and `limit`
        has_more:
          type: boolean

    AggregateResult:
      type: object
      required: [type, columns, rows, total_rows, has_more]
      properties:
        type:
          type: string
          enum: [aggregate]
        columns:
          type: array
          items:
            type: string
          description: Built-in fields first, then the other columns alphabetically
        rows:
          type: array
          items:
            type: array
            items: {}
        total_rows:
          type: integer
          description: Rows before `offset` and `limit`
        has_more:
          type: boolean

    QueryResponse:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/EventsResult'
            - $ref: '#/components/schemas/AggregateResult'
        meta:
          $ref: '#/components/schemas/QueryMeta'

    QueryMeta:
      type: object
      properties:
        took_ms:
          type: number
        scanned:
          type: integer
        query_id:
          type: string
        segments_errored:
          type: integer
        stats:
          $ref: '#/components/schemas/QueryStats'
        explain:
          type: object
          properties:
            source_scope:
              type: object
              properties:
                selected:
                  type: array
                  items:
                    type: string
                count:
                  type: integer
            segments:
              type: object
              additionalProperties:
                type: integer
            candidate_rows:
              type: integer
            regex_engine:
              type: string
            literal_extraction:
              type: boolean
            wall_clock_ms:
              type: number
            scanned_bytes:
              type: integer
        warnings:
          type: array
          items:
            type: string
        lints:
          type: array
          items:
            $ref: '#/components/schemas/QueryLint'
        suggestions:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              reason:
                type: string
              message:
                type: string
        rewrites:
          type: array
          items:
            type: object
            properties:
              before:
                type: string
              after:
                type: string
              reason:
                type: string

    QueryLint:
      type: object
      properties:
        code:
          type: string
          enum: [ALL_SOURCES_HIGH_VOLUME, BROAD_SEARCH]
        message:
          type: string
        reason:
          type: string
        severity:
          type: string
        position:
          type: integer

    QueryStats:
      type: object
      additionalProperties: true
      properties:
        rows_scanned:
          type: integer
        rows_returned:
          type: integer
        matched_rows:
          type: integer
        segments_total:
          type: integer
        segments_scanned:
          type: integer
        segments_skipped_index:
          type: integer
        segments_skipped_time:
          type: integer
        segments_skipped_stats:
          type: integer
        segments_skipped_bloom:
          type: integer
        segments_skipped_range:
          type: integer
        indexes_used:
          type: array
          items:
            type: string
        parse_ms:
          type: number
        optimizer_rules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
        processed_bytes:
          type: integer
        peak_memory_bytes:
          type: integer
        spilled_to_disk:
          type: boolean
        cpu_user_ms:
          type: number
        cpu_sys_ms:
          type: number
        cache_hit:
          type: boolean
        segment_details:
          type: array
          items:
            type: object
            additionalProperties: true

    JobProgress:
      type: object
      properties:
        phase:
          type: string
          enum: [parsing, scanning_buffer, filtering_segments, scanning_segments, executing_pipeline]
        segments_total:
          type: integer
        segments_scanned:
          type: integer
        segments_dispatched:
          type: integer
        segments_skipped_index:
          type: integer
        segments_skipped_time:
          type: integer
        segments_skipped_stats:
          type: integer
        segments_skipped_bloom:
          type: integer
        segments_skipped_range:
          type: integer
        buffered_events:
          type: integer
        rows_read_so_far:
          type: integer
        elapsed_ms:
          type: number

    JobHandleResponse:
      type: object
      properties:
        data:
          type: object
          required: [type, job_id, status]
          properties:
            type:
              type: string
              enum: [job]
            job_id:
              type: string
            status:
              type: string
              enum: [running]
            progress:
              $ref: '#/components/schemas/JobProgress'
        meta:
          $ref: '#/components/schemas/QueryMeta'

    JobResponse:
      type: object
      properties:
        data:
          type: object
          required: [type, job_id, status]
          properties:
            type:
              type: string
              enum: [job]
            job_id:
              type: string
            status:
              type: string
              enum: [running, done, error, canceled]
            query:
              type: string
            created_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time
            progress:
              $ref: '#/components/schemas/JobProgress'
            results:
              oneOf:
                - $ref: '#/components/schemas/EventsResult'
                - $ref: '#/components/schemas/AggregateResult'
            error:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string
        meta:
          $ref: '#/components/schemas/QueryMeta'

    JobListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            jobs:
              type: array
              items:
                type: object
                properties:
                  job_id:
                    type: string
                  query:
                    type: string
                  status:
                    type: string
                  created_at:
                    type: string
                    format: date-time

    CancelJobResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            job_id:
              type: string
            status:
              type: string
            canceled:
              type: boolean
            completed_at:
              type: string
              format: date-time

    ExplainResponse:
      type: object
      properties:
        data:
          type: object
          required: [is_valid, errors]
          properties:
            is_valid:
              type: boolean
            errors:
              type: array
              items:
                $ref: '#/components/schemas/CompileError'
            parsed:
              type: object
              properties:
                result_type:
                  type: string
                  enum: [events, aggregate]
                estimated_cost:
                  type: string
                  enum: [low, medium, high]
                uses_full_scan:
                  type: boolean
                fields_read:
                  type: array
                  items:
                    type: string
                search_terms:
                  type: array
                  nullable: true
                  items:
                    type: string
                has_time_bounds:
                  type: boolean
                logical_plan:
                  type: string
                optimized_plan:
                  type: string
                compile_ms:
                  type: number
                optimizer_rules:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      count:
                        type: integer
                source_scope:
                  type: object
                  properties:
                    type:
                      type: string
                    sources:
                      type: array
                      items:
                        type: string
                    pattern:
                      type: string
                    total_sources_available:
                      type: integer
            execution:
              $ref: '#/components/schemas/QueryStats'

    CompileError:
      type: object
      properties:
        kind:
          type: string
          enum: [syntax, semantic, type, unsupported_command, unsupported_function, unsupported_feature]
        message:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        expected:
          type: array
          items:
            type: string
        suggestion:
          type: string

    CatalogResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            language:
              type: string
              enum: [ppl]
            commands:
              type: array
              items:
                type: object
                required: [name, support]
                properties:
                  name:
                    type: string
                  support:
                    type: string
                    enum: [full, partial, unsupported]
                  notes:
                    type: string
            functions:
              type: array
              items:
                type: object
                required: [name, kind, support]
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum: [scalar, aggregate]
                  category:
                    type: string
                  support:
                    type: string
                    enum: [full, unsupported]
                  lowering:
                    type: string
                  notes:
                    type: string
                  doc:
                    type: string
                  unsupported:
                    type: string

    # Live and schema

    HistogramResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            interval:
              type: string
              description: Go duration, such as `15m0s`
            buckets:
              type: array
              items:
                type: object
                properties:
                  time:
                    type: string
                    format: date-time
                  count:
                    type: integer
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
            total:
              type: integer
        meta:
          type: object
          properties:
            took_ms:
              type: number

    FieldsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                    enum: [string, int, float, bool, datetime]
                  coverage:
                    type: number
                    description: Percentage of events with the field, 0 to 100
                  total_count:
                    type: integer
                  top_values:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                        count:
                          type: integer

    FieldValuesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            field:
              type: string
            values:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  count:
                    type: integer
                  percent:
                    type: number
            unique_count:
              type: integer
            total_count:
              type: integer

    SourcesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            pattern:
              type: string
            sources:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  event_count:
                    type: integer
                  first_event:
                    type: string
                    format: date-time
                  last_event:
                    type: string
                    format: date-time

    # Ingest

    StructuredIngestEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          description: Event text, stored in `_raw`
        time:
          type: number
          description: Unix time in seconds
        source:
          type: string
        sourcetype:
          type: string
        host:
          type: string
        index:
          type: string
          description: Target index; `main` when empty
        fields:
          type: object
          additionalProperties: true
          description: String, number and boolean values are kept

    IngestResponse:
      type: object
      properties:
        data:
          type: object
          required: [accepted, failed]
          properties:
            accepted:
              type: integer
            failed:
              type: integer
            truncated:
              type: boolean
            warning:
              type: string

    IndexesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            indexes:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  retention_period:
                    type: string
                  replication_factor:
                    type: integer

    CreateIndexRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        retention_days:
          type: integer
        replication_factor:
          type: integer

    CreateIndexResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            name:
              type: string
            status:
              type: string

    HECEvent:
      type: object
      properties:
        time:
          type: number
          description: Unix time in seconds
        event:
          description: Event text, or an object stored as its JSON text
        host:
          type: string
        source:
          type: string
        sourcetype:
          type: string
        index:
          type: string
          description: Stored as `_source` when `source` is empty, else as the field `source_tag`
        fields:
          type: object
          additionalProperties: true

    HECResponse:
      type: object
      properties:
        text:
          type: string
        code:
          type: integer
        ackId:
          type: integer
        skipped_lines:
          type: integer

    ESBulkResponse:
      type: object
      properties:
        took:
          type: integer
        errors:
          type: boolean
        items:
          type: array
          items:
            type: object
            properties:
              index:
                $ref: '#/components/schemas/ESBulkItem'
              create:
                $ref: '#/components/schemas/ESBulkItem'

    ESBulkItem:
      type: object
      properties:
        _id:
          type: string
        _index:
          type: string
        status:
          type: integer
        result:
          type: string
        error:
          type: object
          properties:
            type:
              type: string
            reason:
              type: string

    ESIndexDocResponse:
      type: object
      properties:
        _id:
          type: string
        _index:
          type: string
        result:
          type: string

    ESClusterInfo:
      type: object
      properties:
        name:
          type: string
        cluster_name:
          type: string
        cluster_uuid:
          type: string
        version:
          type: object
          additionalProperties: true
        tagline:
          type: string

    # Server

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              enum: [healthy, degraded]
            degraded:
              type: boolean
            version:
              type: string

    StatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            version:
              type: string
            uptime_seconds:
              type: number
            health:
              type: string
            storage:
              type: object
              properties:
                used_bytes:
                  type: integer
            events:
              type: object
              properties:
                total:
                  type: integer
                today:
                  type: integer
            queries:
              type: object
              properties:
                active:
                  type: integer
            tail:
              type: object
              properties:
                active_sessions:
                  type: integer
                subscriber_count:
                  type: integer
                total_dropped_events:
                  type: integer
            retention:
              type: object
              properties:
                oldest_event:
                  type: string
            memory:
              type: object
              additionalProperties: true

    StatsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            uptime_seconds:
              type: number
            storage_bytes:
              type: integer
            total_events:
              type: integer
            events_today:
              type: integer
            index_count:
              type: integer
            segment_count:
              type: integer
            buffered_events:
              type: integer
            sources:
              type: array
              items: {}
            oldest_event:
              type: string

    CompactionHistoryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            compactions:
              type: array
              items:
                type: object
                additionalProperties: true
            count:
              type: integer

    CacheStatsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            hits:
              type: integer
            misses:
              type: integer
            hit_rate:
              type: number
            entries:
              type: integer
            size_bytes:
              type: integer
            evictions:
              type: integer

    ConfigPatchResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            config:
              type: object
              additionalProperties: true
            restart_required:
              type: array
              items:
                type: string

    # Auth

    CreateKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [ingest, query, admin, full]
          default: full
        expires_in:
          type: string
          description: Go duration (`720h`), or days, weeks or years (`30d`, `4w`, `1y`); `never` for no expiry
        description:
          type: string

    APIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scope:
          type: string
          enum: [ingest, query, admin, full]
        description:
          type: string
        expires_at:
          type: string
          format: date-time
        is_root:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    CreatedKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          properties:
            token:
              type: string
              description: Shown once
            api_key:
              type: string
              description: '`id:token`, for the `ApiKey` scheme'

    RotateRootResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        token:
          type: string
        is_root:
          type: boolean
        revoked_key_id:
          type: string
        created_at:
          type: string
          format: date-time
