name: Docs

# Publishes the documentation site at docs.lynxdb.org.
on:
  push:
    branches:
      - main
    paths:
      - docs/site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/mise
        with:
          go-cache: false
      - run: mise run docs
      - name: Deploy documentation Worker
        working-directory: docs/site
        run: mise x node@26.12.1 -- npx --yes cf@1.0.0-rc.6 deploy ./build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SEND_TELEMETRY: 'false'
      - name: Verify crawler files
        run: |
          for file in robots.txt sitemap.xml llms.txt llms-full.txt; do
            curl --fail --silent --show-error --retry 4 --output /dev/null "https://docs.lynxdb.org/$file"
          done
