name: Conformance

# Runs every supported shipper version against a server, which takes too long
# for every change.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

concurrency:
  group: conformance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Shipper matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
      - run: mise run test:conformance
