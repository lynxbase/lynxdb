# .github/workflows/ci.yaml
#
# CI pipeline for LynxDB
#
# Runs on every push to main and every pull request targeting main.
# Jobs:
#   1. build      — compile + vet (fast gate)
#   2. test-unit  — unit tests with race detector
#   3. test-e2e   — end-to-end tests (full server harness)
#   4. test-cli   — CLI integration tests against compiled binary
#   5. test-golden — golden tests (query output regression via .test/.expected files)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.5.7
          install: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.5.7
          install: true
          cache: true

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build docs
        working-directory: docs/site
        run: npm run build

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.5.7
          install: true
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1 -timeout 300s -race

  test-e2e:
    name: E2E Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.5.7
          install: true
          cache: true

      - name: Run E2E tests
        run: go test -tags e2e -count=1 -timeout 180s ./test/e2e/

  test-compat:
    name: Shipper Compatibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.5.7
          install: true
          cache: true

      - name: Run shipper compatibility tests
        run: make test-compat

  test-cli:
    name: CLI Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.5.7
          install: true
          cache: true

      - name: Build binary
        run: go build -o lynxdb ./cmd/lynxdb/

      - name: Run CLI tests
        run: go test -tags clitest -count=1 -timeout 600s -skip '^TestGolden' ./test/cli/

  test-golden:
    name: Golden Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.5.7
          install: true
          cache: true

      - name: Run golden tests
        run: go test -tags clitest -count=1 -timeout 300s -run '^TestGolden' -v ./test/cli/
